name: Build and Publish ModelRelay Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream modelrelay version (e.g. 1.13.2)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download upstream release
        run: |
          curl -fsSL -o modelrelay.tar.gz \
            "https://github.com/ellipticmarketing/modelrelay/archive/refs/tags/${{ inputs.version }}.tar.gz"
          mkdir -p build-context
          tar -xzf modelrelay.tar.gz -C build-context --strip-components=1

      - name: Inject score-overrides hook into upstream sources.js
        run: node scripts/patch-sources.js build-context/sources.js

      - name: Validate score-overrides.json has no covered entries
        run: node scripts/validate-score-overrides.js build-context/sources.js build-context/scores.js

      - name: Apply additive custom overrides
        run: |
          if [ -d "custom-overrides/lib" ]; then
            cp -r custom-overrides/lib build-context/
            echo "Applied custom-overrides/lib files"
          else
            echo "No custom-overrides/lib directory, skipping"
          fi

      - name: Copy Dockerfile
        run: cp Dockerfile build-context/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build-context
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
